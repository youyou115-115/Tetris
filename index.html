<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYPER TETRIS: OVERDRIVE</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Permanent+Marker&display=swap');

    :root {
        --neon-cyan: #00ffff;
        --neon-magenta: #ff00ff;
        --neon-yellow: #ffff00;
        --neon-red: #ff003c;
    }

    body { 
        margin: 0; 
        background: #000; 
        color: #fff; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        width: 100vw; 
        overflow: hidden; 
        font-family: 'Orbitron', sans-serif;
        touch-action: none;
        background: radial-gradient(circle, #001a1a 0%, #050505 100%);
    }

    #game-container { 
        position: relative; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        width: 100%; 
        height: 100%;
        background: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
    }

    #ui-container { 
    display: flex; 
    width: 95vw; /* 画面幅いっぱい */
    max-width: 400px; /* Canvasの幅に合わせる */
    justify-content: space-between; 
    padding: 15px;
    background: rgba(0, 255, 255, 0.1); /* ネオンの光が漏れているような背景 */
    border: 3px solid rgba(0, 255, 255, 0.3);
    border-bottom: none; /* Canvasと一体化させる */
    box-sizing: border-box;
    z-index: 10;
    margin-bottom: 5px; /* Canvasとの隙間 */
}

.game-area {
    position: relative;
    display: inline-block;
    z-index: 1;
}



    .stat-label { 
        font-family: 'Permanent Marker', cursive; 
        font-size: 14px; 
        color: var(--neon-cyan); 
        text-transform: uppercase; 
        letter-spacing: 2px;
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    }

    .stat-value { 
        font-size: 24px; 
        font-weight: 900;
        color: #fff; 
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-magenta);
    }

    /* Canvasの親要素 */
    .canvas-wrapper {
        position: relative;
        display: inline-block;
    }

    canvas { 
        border: 3px solid rgba(0, 255, 255, 0.5);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.2);
        background: #050505;
        max-width: 90vw;
        max-height: 70vh;
        object-fit: contain;
        display: block;
    }

    /* タイトル画面：Canvasの真ん中に重なる */
    #title-screen.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7); /* 背景を少し暗くしてボタンを際立たせる */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000; /* 非常に高い数値にして、確実に最前面へ */
    
    /* 【重要】これがないと、背後のCanvasの操作を邪魔したり、逆にボタンが反応しなかったりします */
    pointer-events: none; 
}

#title-screen button {
    /* 【重要】ボタンだけは「クリック（タップ）を受け付ける」ように設定 */
    pointer-events: auto; 
    position: relative;
    z-index: 1001; /* ボタンをタイトル画面の中でも一番上に */
    
    /* 既存のスタイルを維持 */
    padding: 15px 40px;
    font-size: 28px;
    font-family: 'Orbitron', sans-serif;
    background: transparent;
    border: 3px solid var(--neon-magenta);
    color: var(--neon-magenta);
    cursor: pointer;
    box-shadow: 0 0 15px var(--neon-magenta), inset 0 0 10px var(--neon-magenta);
    transition: 0.3s;
    text-transform: uppercase;
}

    /* ゲームオーバー画面 */
    #gameover-screen.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
}

    .overlay h1 { 
        font-family: 'Permanent Marker', cursive;
        font-size: 32px; 
        color: var(--neon-cyan); 
        text-align: center; 
        margin-bottom: 15px; 
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-magenta);
        line-height: 1.2;
    }

    .overlay button { 
        padding: 12px 30px; 
        font-size: 22px; 
        font-family: 'Orbitron', sans-serif;
        background: transparent; 
        border: 3px solid var(--neon-magenta); 
        color: var(--neon-magenta);
        cursor: pointer; 
        box-shadow: 0 0 15px var(--neon-magenta), inset 0 0 10px var(--neon-magenta);
        transition: 0.3s;
        text-transform: uppercase;
        pointer-events: auto; /* ボタンを確実にクリック可能にする */
    }

    .overlay button:active { 
        transform: scale(0.95); 
        background: var(--neon-magenta); 
        color: #fff; 
        box-shadow: 0 0 40px var(--neon-magenta);
    }
        
   #combo-popup {
    position: absolute;
    top: -60px; /* Canvasの「外（上）」に配置 */
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    display: none;
    z-index: 100;
    text-transform: uppercase;
    white-space: nowrap;
    /* 派手なグラフィティ・ネオン効果 */
    text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px var(--neon-yellow),
        0 0 40px var(--neon-magenta);
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}
    .shake { animation: shake 0.2s infinite; }
    @keyframes shake {
        0% { transform: translate(2px, 2px); }
        50% { transform: translate(-2px, -2px); }
        100% { transform: translate(2px, -2px); }
    }
</style>
</head>
<body>
    <div id="game-container">
    <!-- 【修正】UIはCanvasの外、一番上に配置 -->
    <div id="ui-container">
        <div id="ui">
            <div class="stat-label">SCORE</div>
            <div id="score" class="stat-value">0</div>
            <div class="stat-label">LEVEL</div>
            <div id="level" class="stat-value">1</div>
        </div>
        <div id="next-container">
            <div class="stat-label">NEXT</div>
            <canvas id="next" width="60" height="60"></canvas>
        </div>
    </div>

    <!-- ゲーム画面エリア -->
    <div class="game-area" style="position: relative; display: inline-block;">
        <canvas id="tetris"></canvas>
        
        <!-- タイトル画面：Canvasの真ん中に重なる -->
        <div id="title-screen" class="overlay">
            <h1 style="font-size: 32px; margin-bottom: 10px;">HYPER<br>TETRIS<br><span style="color: var(--neon-magenta); font-size: 20px;">OVERDRIVE</span></h1>
            <button onclick="startGame()">START</button>
        </div>

        <!-- コンボ表示：Canvasの「すぐ上」に飛び出す -->
        <div id="combo-popup">COMBO!!</div>
    </div>

    <!-- ゲームオーバー画面：画面全体を覆う -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1 style="color: #f00; text-shadow: 0 0 20px #f00;">GAME OVER</h1>
        <div class="stat-label">FINAL SCORE</div>
        <div id="final-score" class="stat-value" style="color: #fff;">0</div>
        <div class="stat-label">HIGH SCORE</div>
        <div id="high-score" class="stat-value" style="color: var(--neon-yellow);">0</div>
        <button onclick="startGame()" style="margin-top: 20px;">RETRY</button>
    </div>
</div>

<script type="module">
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const ROW = 20;
    const COL = 10;
    const SQ = 30;
    canvas.width = COL * SQ;
    canvas.height = ROW * SQ;

    const colors = [null, '#FF0055', '#00FFCC', '#FFCC00', '#FF00FF', '#00FF00', '#0066FF', '#FF8800'];
    const pieceTypes = {
        'I': [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
        'L': [[0, 2, 0], [0, 2, 0], [0, 2, 2]],
        'J': [[0, 3, 0], [0, 3, 0], [3, 3, 0]],
        'O': [[4, 4], [4, 4]],
        'Z': [[5, 5, 0], [0, 5, 5], [0, 0, 0]],
        'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
        'T': [[0, 7, 0], [7, 7, 7], [0, 0, 0]]
    };

    let arena = [];
    // script内のplayer定義を修正
let player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1, combo: 0, isBoostMode: false };
    let dropCounter = 0;
    let lastTime = 0;
    let dropInterval = 1000;
    let isGameOver = false;
    let gridOffset = 0;

           class AudioEngine {
        constructor() {
            this.ctx = null;
            this.masterGain = null;
            this.initialized = false;
            this.timerId = null;
            this.step = 0;
        }
        init() {
            // すでに動いている場合は、一旦完全に止める
            this.stopBGM();

            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.value = 0.4;
            this.initialized = true;
            this.startBGM();
        }
        stopBGM() {
            // タイマーをクリアして、フラグを下ろす
            if (this.timerId) {
                clearTimeout(this.timerId);
                this.timerId = null;
            }
            this.initialized = false;
        }
        playSynth(freq, type, duration, vol, glide = 0) {
            if (!this.initialized || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (glide > 0) osc.frequency.exponentialRampToValueAtTime(freq / 2, this.ctx.currentTime + duration);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        }
        playImpact(vol = 0.5) {
            this.playSynth(60, 'sine', 0.4, vol);
            this.playSynth(40, 'square', 0.2, vol * 0.5);
        }
        playClear(count) {
            // 消去音：ジャズ・ピアノの和音（コード）が響くような音
            // 1行消すごとに、少しずつ音程が上がる「ジャーン」という響き
            const baseFreqs = [220, 261.63, 329.63, 392.00, 523.25]; // C, E, G, B, C (Cmaj7風)
            
            for(let i=0; i<count; i++) {
                // 複数の音を同時に鳴らして「和音」を作る
                this.playSynth(baseFreqs[i % 5], 'sine', 0.8, 0.2);
                this.playSynth(baseFreqs[(i+1) % 5] * 1.2, 'triangle', 0.6, 0.1);
            }
            // 最後に少しだけ低音の余韻を添える
            this.playSynth(baseFreqs[0] / 2, 'sine', 1.0, 0.2);
        }
        startBGM() {
            this.nextNoteTime = this.ctx.currentTime;
            this.scheduleNote();
        }
                   scheduleNote() {
            if (isGameOver || !this.initialized) return;
            
            // 【ジャズ】少しゆったりとした、スウィング感のあるテンポ
            const tempo = 110; 
            const secondsPerBeat = 60 / tempo;
            
            // 【ジャズ】テンションを含んだ、少し複雑で美しい音程の並び
            // C Major 9th / 13th 風の動き
            const scale = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76]; 
            
            // --- 1. メロディ (Triangle: ジャズ・ピアノ風の音色) ---
            // スウィング感を出すため、拍の「裏」に音を置く（シンコペーション）
            const melodyIdx = (this.step % 8);
            const melodyFreq = scale[melodyIdx % scale.length];
            
            // 拍の「裏」に音を置くことで、ジャズ特有の「タッ・カ」というリズムを作る
            if (this.step % 2 === 1) {
                this.playSynth(melodyFreq, 'triangle', secondsPerBeat * 0.6, 0.25);
            }

            // --- 2. コード・バッキング (Sine: 柔らかいピアノの響き) ---
            // 1拍目と3拍目に、コードの根音（ルート）を置く
            if (this.step % 4 === 0) {
                this.playSynth(scale[0] / 2, 'sine', secondsPerBeat * 1.5, 0.15);
            }
            if (this.step % 4 === 2) {
                // 3拍目は少し高い音（テンション）を混ぜて、ジャズ感を出す
                this.playSynth(scale[4] / 2, 'sine', secondsPerBeat * 1.5, 0.12);
            }

            // --- 3. 装飾音 (Sine: 高い音のアクセント) ---
            // 4拍目の最後に、キラリと光るような高い音を添える
            if (this.step % 4 === 3) {
                this.playSynth(scale[7] * 2, 'sine', 0.2, 0.1);
            }

            this.step++;
            this.nextNoteTime += secondsPerBeat;
            this.timerId = setTimeout(() => this.scheduleNote(), secondsPerBeat * 1000);
        }
        playMove() { this.playSynth(400, 'sine', 0.05, 0.05); }
        playRotate() { this.playSynth(600, 'sine', 0.1, 0.05); }
        playDrop() { this.playSynth(200, 'sine', 0.1, 0.1); }
        playHardDrop() { this.playImpact(0.6); }
       playLand() {
            // 設置音：短く、少し高めの「コツッ」という音
            this.playSynth(440, 'triangle', 0.1, 0.1);
        }
        playGameOver() {
            this.playSynth(100, 'sawtooth', 1.0, 0.4);
            this.playSynth(50, 'sawtooth', 1.5, 0.4);
        }
    }

    const audio = new AudioEngine();

    class LightningParticle {
        constructor(x, y, color, intensity) {
            this.x = x; this.y = y; this.color = color; this.intensity = intensity;
            this.points = [{x: x, y: y}];
            this.life = 1.0;
            this.decay = 0.03 + Math.random() * 0.05;
            this.generateLightning();
        }
        generateLightning() {
            let curX = this.x; let curY = this.y;
            const segments = 5 + (this.intensity * 5);
            for (let i = 0; i < segments; i++) {
                curX += (Math.random() - 0.5) * (40 * this.intensity);
                curY += (Math.random() - 0.5) * (40 * this.intensity);
                this.points.push({x: curX, y: curY});
            }
        }
        update() { this.life -= this.decay; }
        draw(context) {
            context.beginPath();
            context.strokeStyle = this.color;
            context.lineWidth = (3 * this.intensity) * this.life;
            context.shadowBlur = 20 * this.intensity * this.life;
            context.shadowColor = this.color;
            context.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) context.lineTo(this.points[i].x, this.points[i].y);
            context.stroke();
            context.shadowBlur = 0;
        }
    }

    let particles = [];

    function createLightning(x, y, intensity) {
        let color = intensity >= 3 ? '#ff0' : (intensity === 2 ? '#f0f' : '#fff');
        for(let i=0; i<intensity * 2; i++) particles.push(new LightningParticle(x, y, color, intensity));
    }

    function createPiece(type) { return JSON.parse(JSON.stringify(pieceTypes[type])); }

    function drawSquare(x, y, color, context = ctx, size = SQ) {
    // 1. ブロックの本体（少し透明感のある色）
    context.fillStyle = color;
    context.globalAlpha = 0.8;
    context.fillRect(x * size, y * size, size, size);
    context.globalAlpha = 1.0;

    // 2. ネオンの縁取り（光るライン）
    context.strokeStyle = '#fff'; // 中心は白くして輝きを出す
    context.lineWidth = 2;
    context.strokeRect(x * size + 2, y * size + 2, size - 4, size - 4);

    // 3. 外側のネオン・グロー（光の滲み）
    context.shadowBlur = 10;
    context.shadowColor = color;
    context.strokeStyle = color;
    context.lineWidth = 1;
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.shadowBlur = 0;

    // 4. ハイライト（光が当たっている感じ）
    context.fillStyle = 'rgba(255, 255, 255, 0.4)';
    context.fillRect(x * size + 2, y * size + 2, size / 2, 2);
}

   // draw関数内の背景描画部分を修正
function draw() {
    // 背景を少し暗いグラデーションにする
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 背景グリッド（少し歪んだ感じを出すために透明度を調整）
    gridOffset = (gridOffset + (player.level * 0.5)) % SQ;
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= COL; i++) { 
        ctx.beginPath(); ctx.moveTo(i * SQ, 0); ctx.lineTo(i * SQ, canvas.height); ctx.stroke(); 
    }
    for (let i = -1; i <= ROW; i++) {
        let yPos = i * SQ + gridOffset;
        ctx.beginPath(); ctx.moveTo(0, yPos); ctx.lineTo(canvas.width, yPos); ctx.stroke();
    }

    // --- 追加：ノイズ・テクスチャ効果（ランダムなドットを薄く描画） ---
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    for (let i = 0; i < 10; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
    }

    arena.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(x, y, colors[value]); }); });
    if (player.matrix) {
        player.matrix.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(player.pos.x + x, player.pos.y + y, colors[value]); }); });
    }
    particles.forEach((p, index) => {
        p.update(); p.draw(ctx);
        if (p.life <= 0) particles.splice(index, 1);
    });
}

    function drawNext() {
        nextCtx.fillStyle = '#111';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (player.next) {
            const m = player.next;
            const size = 15; const offset = 15;
            m.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) { nextCtx.fillStyle = colors[value]; nextCtx.fillRect(x * size + offset, y * size + offset, size - 2, size - 2); } }); });
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0) {
                    const ty = y + o.y; const tx = x + o.x;
                    if (ty >= ROW || ty < 0 || tx >= COL || tx < 0 || (arena[ty] && arena[ty][tx] !== 0)) return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const ty = y + player.pos.y;
                    if (ty >= 0 && ty < ROW) arena[ty][x + player.pos.x] = value;
                }
            });
        });
    }

    function arenaSweep() {
    let rowCount = 0;
    for (let y = ROW - 1; y >= 0; --y) {
        if (arena[y].every(val => val !== 0)) {
            for (let x = 0; x < COL; x++) createLightning(x * SQ + SQ/2, y * SQ + SQ/2, rowCount + 1);
            arena.splice(y, 1);
            arena.unshift(new Array(COL).fill(0));
            rowCount++;
            y++;
        }
    }
    if (rowCount > 0) {
        player.combo++;
        player.score += rowCount * 100 * player.level * player.combo;
        const newLevel = Math.floor(player.score / 1000) + 1;
        if (newLevel > player.level) player.level = newLevel;

        const popup = document.getElementById('combo-popup');
        popup.style.display = 'block';
        
         // 【修正】コンボ文字が「Canvasの外（上）」から飛び出す演出
        popup.style.top = "-60px"; 
        
        // テキスト設定
        if (rowCount === 1) { 
            popup.innerText = "CLEARED!"; 
            popup.style.color = "#0ff"; 
            popup.style.fontSize = "40px";
        } else if (rowCount === 2) { 
            popup.innerText = "DOUBLE!!"; 
            popup.style.color = "#f0f"; 
            popup.style.fontSize = "50px";
        } else if (rowCount === 3) { 
            popup.innerText = "TRIPLE!!!"; 
            popup.style.color = "#ff0"; 
            popup.style.fontSize = "60px";
        } else { 
            popup.innerText = "ULTRA " + rowCount + "!!!"; 
            popup.style.color = "#f00"; 
            popup.style.fontSize = "70px";
        }

        // 【修正】アニメーション：Canvasの外で「飛び出して消える」
        popup.animate([
            { transform: 'translateX(-50%) scale(0.5) translateY(0)', opacity: 0 },
            { transform: 'translateX(-50%) scale(1.2) translateY(-20px)', opacity: 1 },
            { transform: 'translateX(-50%) scale(1) translateY(-40px)', opacity: 0 }
        ], {
            duration: 600,
            easing: 'ease-out'
        });

        setTimeout(() => popup.style.display = 'none', 600);
        updateUI();
        audio.playClear(rowCount);
    } else {
        player.combo = 0;
    }
    return rowCount;
}

    function updateUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
    }

// script内のplayerDrop関数を修正
    function playerDrop() {
        player.pos.y++;
        
        // 1. まず、プレイヤーが画面外（y < 0）に突き抜けたかチェック
        // これが「枠を超えた」判定です
        const isOut = player.pos.y < 0 || player.matrix.some((row, y) => 
            row.some(value => value !== 0 && (player.pos.y + y) < 0)
        );

        if (isOut) {
            gameOver();
            return; // ここで終了
        }

        // 2. 衝突判定（着地判定）
        if (collide(arena, player)) {
            player.pos.y--; // 衝突した位置に戻す
            merge(arena, player); // 盤面に固定
            arenaSweep(); // ライン消去
            
            // 着地した結果、一番上の行にブロックが残った場合もゲームオーバー
            if (arena[0].some(val => val !== 0)) {
                gameOver();
            } else {
                playerReset();
            }
        }
        
        dropCounter = 0;
    }
    function playerMove(dir) {
    player.isBoostMode = false; // 【追加】操作したらブースト解除
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    } else {
        audio.playMove();
    }
}

    function playerRotate() {
    player.isBoostMode = false; // 【追加】操作したらブースト解除
    const oldMatrix = player.matrix;
    player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i]).reverse());
    if (collide(arena, player)) {
        player.matrix = oldMatrix;
    } else {
        audio.playRotate();
    }
}
       function playerReset() {
        const pieces = 'ILJOTSZ';
        if (!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = Math.floor(COL / 2) - Math.floor(player.matrix[0].length / 2);
        drawNext();
        
        // ここには何も書かない（判定は playerDrop で行う）
    }

    function gameOver() {
        isGameOver = true;
        audio.playGameOver();
        audio.stopBGM();
        updateHighScore();
        document.getElementById('gameover-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = player.score;
    }

    function updateHighScore() {
        const highScore = localStorage.getItem('tetris_high_score') || 0;
        if (player.score > highScore) localStorage.setItem('tetris_high_score', player.score);
        document.getElementById('high-score').innerText = localStorage.getItem('tetris_high_score');
    }

    function update(time = 0) {
    if (isGameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;

    // --- 【追加】毎フレーム、画面外への突き抜けをチェック ---
    // プレイヤーの座標がマイナスになったら、即ゲームオーバー
    if (player.pos.y < 0) {
        gameOver();
        return;
    }

    const currentInterval = player.isBoostMode 
        ? 100 
        : Math.max(200, 1000 - (player.level * 50)); 

    if (dropCounter >= currentInterval) {
        playerDrop();
        dropCounter -= currentInterval; 
    }
    draw();
    requestAnimationFrame(update);
}
    window.startGame = function() {
        audio.init();
        arena = Array.from({ length: ROW }, () => Array(COL).fill(0));
        player.score = 0; player.level = 1; player.combo = 0; player.next = null;
        isGameOver = false;
        particles = [];
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        updateUI();
        playerReset();
        update();
    };

    document.addEventListener('keydown', event => {
        if (isGameOver) return;
        const key = event.key.toLowerCase();
        if (key === 'a') playerMove(-1);
        if (key === 'd') playerMove(1);
        if (key === 'w') playerRotate();
        if (key === 's') {
            playerDrop();
        } else if (key === ' ') {
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            arenaSweep();
            if (arena[0].some(val => val !== 0)) { gameOver(); } 
            else { playerReset(); }
            audio.playHardDrop();
            event.preventDefault();
        }
    });

    // scriptタグ内の該当箇所を修正

// --- スマホ操作の修正 ---
document.addEventListener('contextmenu', event => event.preventDefault());

let touchStartX = 0, touchStartY = 0, touchStartTime = 0, longPressTimer;

window.addEventListener('touchstart', (e) => {
    // ブラウザのデフォルト動作（ズーム、スクロール、選択）を防止
    if (e.cancelable) e.preventDefault();

    if (isGameOver) return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = Date.now();

    // 長押し：ソフトドロップ
    longPressTimer = setTimeout(() => {
        if (Date.now() - touchStartTime < 500) {
            playerDrop();
            audio.playDrop();
        }
    }, 500);
}, {passive: false});

window.addEventListener('touchend', (e) => {
    // ブラウザのデフォルト動作を防止
    if (e.cancelable) e.preventDefault();

    if (isGameOver) return;
    clearTimeout(longPressTimer);
    
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const threshold = 30;

    // フリック判定
    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
        if (Math.abs(dx) > Math.abs(dy)) {
            // 左右フリック：回転
            playerRotate(); 
        } else {
            // 上下フリック
            if (dy > threshold) {
                // 下フリック：ハードドロップ
                while (!collide(arena, player)) player.pos.y++;
                player.pos.y--;
                merge(arena, player);
                arenaSweep();
                if (player.pos.y < 0 || arena[0].some(val => val !== 0)) { 
                    gameOver(); 
                } else { 
                    playerReset(); 
                }
                audio.playHardDrop();
            } else if (dy < -threshold) {
                // 上フリック：回転
                playerRotate();
            }
        }
    } else {
        // タップ判定：左右移動
        if (touch.clientX < window.innerWidth / 2) {
            playerMove(-1);
        } else {
            playerMove(1);
        }
    }
}, {passive: false});

    playerReset();
    draw();
</script>
