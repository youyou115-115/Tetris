<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYPER TETRIS: OVERDRIVE</title>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
        }
        body { 
            margin: 0; background: #000; color: #fff; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: hidden; 
            font-family: 'Arial Black', sans-serif;
            touch-action: none;
        }
        #game-container { 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            height: 100%;
            background: radial-gradient(circle, #001a1a 0%, #000 100%);
        }
        #ui-container { 
            display: flex; 
            width: 95%; 
            justify-content: space-between; 
            padding: 10px;
            z-index: 10;
        }
        #ui { text-align: center; }
        .stat-label { font-size: 10px; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); }
        
        canvas { 
            border: 2px solid rgba(0, 255, 255, 0.3); 
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
            background: #050505;
            /* レスポンシブ対応: 画面に収まるように調整 */
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .overlay h1 { 
            font-size: 40px; color: var(--neon-cyan); text-align: center; 
            margin-bottom: 20px; text-shadow: 0 0 20px var(--neon-cyan);
            line-height: 1;
        }
        .overlay button { 
            padding: 15px 40px; font-size: 24px; background: transparent; 
            border: 2px solid var(--neon-magenta); color: var(--neon-magenta);
            cursor: pointer; font-family: 'Arial Black';
            box-shadow: 0 0 15px var(--neon-magenta);
            transition: 0.3s;
        }
        .overlay button:active { transform: scale(0.9); background: var(--neon-magenta); color: #fff; }
        
        #combo-popup {
            position: absolute; color: var(--neon-yellow); font-size: 40px; font-weight: bold;
            pointer-events: none; display: none; z-index: 100; text-shadow: 0 0 20px #f0f;
        }
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-container">
            <div id="ui">
                <div class="stat-label">SCORE</div>
                <div id="score" class="stat-value">0</div>
                <div class="stat-label">LEVEL</div>
                <div id="level" class="stat-value">1</div>
            </div>
            <div id="next-container">
                <div class="stat-label">NEXT</div>
                <canvas id="next" width="60" height="60"></canvas>
            </div>
        </div>

        <canvas id="tetris"></canvas>
        <div id="combo-popup">COMBO!!</div>

        <div id="title-screen" class="overlay">
            <h1>HYPER<br>TETRIS<br><span style="color: var(--neon-magenta); font-size: 24px;">OVERDRIVE</span></h1>
            <button onclick="startGame()">START</button>
        </div>

        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 style="color: #f00; text-shadow: 0 0 20px #f00;">GAME OVER</h1>
            <div class="stat-label">FINAL SCORE</div>
            <div id="final-score" class="stat-value" style="color: #fff;">0</div>
            <div class="stat-label">HIGH SCORE</div>
            <div id="high-score" class="stat-value" style="color: var(--neon-yellow);">0</div>
            <button onclick="startGame()" style="margin-top: 20px;">RETRY</button>
        </div>
    </div>

<script type="module">
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const ROW = 20;
    const COL = 10;
    const SQ = 30;
    canvas.width = COL * SQ;
    canvas.height = ROW * SQ;

    const colors = [null, '#FF0055', '#00FFCC', '#FFCC00', '#FF00FF', '#00FF00', '#0066FF', '#FF8800'];
    const pieceTypes = {
        'I': [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
        'L': [[0, 2, 0], [0, 2, 0], [0, 2, 2]],
        'J': [[0, 3, 0], [0, 3, 0], [3, 3, 0]],
        'O': [[4, 4], [4, 4]],
        'Z': [[5, 5, 0], [0, 5, 5], [0, 0, 0]],
        'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
        'T': [[0, 7, 0], [7, 7, 7], [0, 0, 0]]
    };

    let arena = [];
    let player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1, combo: 0 };
    let dropCounter = 0;
    let lastTime = 0;
    let dropInterval = 1000;
    let isGameOver = false;
    let gridOffset = 0;

           class AudioEngine {
        constructor() {
            this.ctx = null;
            this.masterGain = null;
            this.initialized = false;
            this.timerId = null;
            this.step = 0;
        }
        init() {
            // すでに動いている場合は、一旦完全に止める
            this.stopBGM();

            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.masterGain.gain.value = 0.4;
            this.initialized = true;
            this.startBGM();
        }
        stopBGM() {
            // タイマーをクリアして、フラグを下ろす
            if (this.timerId) {
                clearTimeout(this.timerId);
                this.timerId = null;
            }
            this.initialized = false;
        }
        playSynth(freq, type, duration, vol, glide = 0) {
            if (!this.initialized || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (glide > 0) osc.frequency.exponentialRampToValueAtTime(freq / 2, this.ctx.currentTime + duration);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        }
        playImpact(vol = 0.5) {
            this.playSynth(60, 'sine', 0.4, vol);
            this.playSynth(40, 'square', 0.2, vol * 0.5);
        }
        playClear(count) {
            for(let i=0; i<count; i++) this.playSynth(220 * (i + 1) * 2, 'sawtooth', 0.5, 0.2);
            this.playImpact(0.4);
        }
        startBGM() {
            this.nextNoteTime = this.ctx.currentTime;
            this.scheduleNote();
        }
                scheduleNote() {
            if (isGameOver || !this.initialized) return;
            
            // 【中毒性UP】さらに高速なテンポ設定
            const tempo = Math.min(280, 160 + (player.level * 15)); 
            const secondsPerBeat = 60 / tempo;
            
            // 明るく、かつ疾走感のあるメロディパターン
            const melodyPattern = [60, 64, 67, 72, 74, 76, 79, 81, 79, 76, 74, 72, 67, 64, 62, 60];
            
            // --- 1. サイバー・ベース (Sawtooth: 躍動感のある低音) ---
            // 4拍子の「1拍目」と「2拍目の裏」で、うねるようなリズムを刻む
            if (this.step % 4 === 0 || this.step % 4 === 2) {
                this.playSynth(48, 'sawtooth', secondsPerBeat * 0.3, 0.2);
            } else if (this.step % 4 === 3) {
                this.playSynth(45, 'sawtooth', secondsPerBeat * 0.2, 0.15);
            }

            // --- 2. メインメロディ (Square: 弾けるようなピコピコ音) ---
            const melodyFreq = melodyPattern[this.step % melodyPattern.length];
            if (this.step % 2 === 0) {
                this.playSynth(melodyFreq, 'square', secondsPerBeat * 0.4, 0.15);
            }

            // --- 3. 高速アルペジオ (Sine/Triangle: サイバーパンクの疾走感) ---
            // 8拍に一度、一瞬だけ高音を駆け上がる「上昇音」を入れて、アゲアゲ感を演出
            if (this.step % 8 === 4) {
                const arpeggio = [72, 76, 79, 84]; // ド, ミ, ソ, 高いド
                arpeggio.forEach((note, i) => {
                    this.playSynth(note, 'sine', 0.1, 0.05);
                });
            }

            // --- 4. キラキラ・アクセント (Triangle: 輝きを加える) ---
            if (this.step % 4 === 3) {
                this.playSynth(melodyFreq * 2, 'triangle', 0.1, 0.1);
            }

            this.step++;
            this.nextNoteTime += secondsPerBeat;
            this.timerId = setTimeout(() => this.scheduleNote(), secondsPerBeat * 1000);
        }
        playMove() { this.playSynth(400, 'sine', 0.05, 0.05); }
        playRotate() { this.playSynth(600, 'sine', 0.1, 0.05); }
        playDrop() { this.playSynth(200, 'sine', 0.1, 0.1); }
        playHardDrop() { this.playImpact(0.6); }
        playLand() { this.playSynth(150, 'triangle', 0.1, 0.1); }
        playGameOver() {
            this.playSynth(100, 'sawtooth', 1.0, 0.4);
            this.playSynth(50, 'sawtooth', 1.5, 0.4);
        }
    }

    const audio = new AudioEngine();

    class LightningParticle {
        constructor(x, y, color, intensity) {
            this.x = x; this.y = y; this.color = color; this.intensity = intensity;
            this.points = [{x: x, y: y}];
            this.life = 1.0;
            this.decay = 0.03 + Math.random() * 0.05;
            this.generateLightning();
        }
        generateLightning() {
            let curX = this.x; let curY = this.y;
            const segments = 5 + (this.intensity * 5);
            for (let i = 0; i < segments; i++) {
                curX += (Math.random() - 0.5) * (40 * this.intensity);
                curY += (Math.random() - 0.5) * (40 * this.intensity);
                this.points.push({x: curX, y: curY});
            }
        }
        update() { this.life -= this.decay; }
        draw(context) {
            context.beginPath();
            context.strokeStyle = this.color;
            context.lineWidth = (3 * this.intensity) * this.life;
            context.shadowBlur = 20 * this.intensity * this.life;
            context.shadowColor = this.color;
            context.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) context.lineTo(this.points[i].x, this.points[i].y);
            context.stroke();
            context.shadowBlur = 0;
        }
    }

    let particles = [];

    function createLightning(x, y, intensity) {
        let color = intensity >= 3 ? '#ff0' : (intensity === 2 ? '#f0f' : '#fff');
        for(let i=0; i<intensity * 2; i++) particles.push(new LightningParticle(x, y, color, intensity));
    }

    function createPiece(type) { return JSON.parse(JSON.stringify(pieceTypes[type])); }

    function drawSquare(x, y, color, context = ctx, size = SQ) {
        context.fillStyle = color;
        context.shadowBlur = 15;
        context.shadowColor = color;
        context.fillRect(x * size, y * size, size, size);
        context.shadowBlur = 0;
        context.strokeStyle = 'rgba(255,255,255,0.5)';
        context.lineWidth = 1;
        context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
        context.fillStyle = 'rgba(255, 255, 255, 0.2)';
        context.fillRect(x * size, y * size, size / 2, size / 2);
    }

    function draw() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 背景グリッド
        gridOffset = (gridOffset + (player.level * 0.5)) % SQ;
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let i = -1; i <= COL; i++) { ctx.beginPath(); ctx.moveTo(i * SQ, 0); ctx.lineTo(i * SQ, canvas.height); ctx.stroke(); }
        for (let i = -1; i <= ROW; i++) {
            let yPos = i * SQ + gridOffset;
            ctx.beginPath(); ctx.moveTo(0, yPos); ctx.lineTo(canvas.width, yPos); ctx.stroke();
        }

        arena.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(x, y, colors[value]); }); });
        if (player.matrix) {
            player.matrix.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(player.pos.x + x, player.pos.y + y, colors[value]); }); });
        }
        particles.forEach((p, index) => {
            p.update(); p.draw(ctx);
            if (p.life <= 0) particles.splice(index, 1);
        });
    }

    function drawNext() {
        nextCtx.fillStyle = '#111';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (player.next) {
            const m = player.next;
            const size = 15; const offset = 15;
            m.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) { nextCtx.fillStyle = colors[value]; nextCtx.fillRect(x * size + offset, y * size + offset, size - 2, size - 2); } }); });
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0) {
                    const ty = y + o.y; const tx = x + o.x;
                    if (ty >= ROW || ty < 0 || tx >= COL || tx < 0 || (arena[ty] && arena[ty][tx] !== 0)) return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const ty = y + player.pos.y;
                    if (ty >= 0 && ty < ROW) arena[ty][x + player.pos.x] = value;
                }
            });
        });
    }

    function arenaSweep() {
        let rowCount = 0;
        for (let y = ROW - 1; y >= 0; --y) {
            if (arena[y].every(val => val !== 0)) {
                for (let x = 0; x < COL; x++) createLightning(x * SQ + SQ/2, y * SQ + SQ/2, rowCount + 1);
                arena.splice(y, 1);
                arena.unshift(new Array(COL).fill(0));
                rowCount++;
                y++;
            }
        }
        if (rowCount > 0) {
            player.combo++;
            player.score += rowCount * 100 * player.level * player.combo;
            const newLevel = Math.floor(player.score / 1000) + 1;
            if (newLevel > player.level) player.level = newLevel;
            const popup = document.getElementById('combo-popup');
            popup.style.display = 'block';
            if (rowCount === 1) { popup.innerText = "CLEARED!"; popup.style.fontSize = "30px"; popup.style.color = "#0ff"; }
            else if (rowCount === 2) { popup.innerText = "DOUBLE!"; popup.style.fontSize = "40px"; popup.style.color = "#f0f"; }
            else if (rowCount === 3) { popup.innerText = "TRIPLE!!"; popup.style.fontSize = "50px"; popup.style.color = "#ff0"; }
            else { popup.innerText = "ULTRA " + rowCount + "!"; popup.style.fontSize = "60px"; popup.style.color = "#f00"; popup.style.textShadow = "0 0 20px #f00"; }
            canvas.classList.add('shake');
            setTimeout(() => canvas.classList.remove('shake'), 300 + (rowCount * 100));
            setTimeout(() => popup.style.display = 'none', 600);
            updateUI();
            audio.playClear(rowCount);
        } else {
            player.combo = 0;
        }
        return rowCount;
    }

    function updateUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
    }

         function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            arenaSweep();
            
            // 【重要】着地した結果、ブロックが画面外(y < 0)に突き抜けたか判定
            // プレイヤーの座標が0未満、またはパーツのどこかが0未満ならアウト
            const isOut = player.pos.y < 0 || player.matrix.some((row, y) => 
                row.some(value => value !== 0 && (player.pos.y + y) < 0)
            );

            if (isOut) {
                gameOver();
            } else {
                playerReset();
            }
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        } else {
            audio.playMove();
        }
    }

    function playerRotate() {
        const oldMatrix = player.matrix;
        player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i]).reverse());
        if (collide(arena, player)) {
            player.matrix = oldMatrix;
        } else {
            audio.playRotate();
        }
    }

       function playerReset() {
        const pieces = 'ILJOTSZ';
        if (!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = Math.floor(COL / 2) - Math.floor(player.matrix[0].length / 2);
        drawNext();
        
        // ここには何も書かない（判定は playerDrop で行う）
    }

    function gameOver() {
        isGameOver = true;
        audio.playGameOver();
        audio.stopBGM();
        updateHighScore();
        document.getElementById('gameover-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = player.score;
    }

    function updateHighScore() {
        const highScore = localStorage.getItem('tetris_high_score') || 0;
        if (player.score > highScore) localStorage.setItem('tetris_high_score', player.score);
        document.getElementById('high-score').innerText = localStorage.getItem('tetris_high_score');
    }

    function update(time = 0) {
        if (isGameOver) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        const currentInterval = Math.max(100, dropInterval - (player.level * 80));
        if (dropCounter > currentInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    window.startGame = function() {
        audio.init();
        arena = Array.from({ length: ROW }, () => Array(COL).fill(0));
        player.score = 0; player.level = 1; player.combo = 0; player.next = null;
        isGameOver = false;
        particles = [];
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        updateUI();
        playerReset();
        update();
    };

    document.addEventListener('keydown', event => {
        if (isGameOver) return;
        const key = event.key.toLowerCase();
        if (key === 'a') playerMove(-1);
        if (key === 'd') playerMove(1);
        if (key === 'w') playerRotate();
        if (key === 's') {
            playerDrop();
        } else if (key === ' ') {
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            arenaSweep();
            if (arena[0].some(val => val !== 0)) { gameOver(); } 
            else { playerReset(); }
            audio.playHardDrop();
            event.preventDefault();
        }
    });

    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, longPressTimer;

    window.addEventListener('touchstart', (e) => {
        if (isGameOver) return;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        touchStartTime = Date.now();
        longPressTimer = setTimeout(() => {
            if (Date.now() - touchStartTime < 500) { playerDrop(); audio.playDrop(); }
        }, 500);
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
        if (isGameOver) return;
        clearTimeout(longPressTimer);
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const threshold = 30;

        if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > threshold) playerRotate(); 
                else {
                    const oldMatrix = player.matrix;
                    player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i]).reverse()).reverse();
                    if (collide(arena, player)) player.matrix = oldMatrix; else audio.playRotate();
                }
            } else {
                if (dy > threshold) {
                    playerMove(0); // 左右移動の代わりに、ここでは何もしないか、既存のロジックに合わせる
                } else if (dy < -threshold) {
                    while (!collide(arena, player)) player.pos.y++;
                    player.pos.y--;
                    merge(arena, player);
                    arenaSweep();
                    if (arena[0].some(val => val !== 0)) { gameOver(); } 
                    else { playerReset(); }
                    audio.playHardDrop();
                }
            }
        } else {
            if (touch.clientX < window.innerWidth / 2) playerMove(-1);
            else playerMove(1);
        }
    }, {passive: false});

    playerReset();
    draw();
</script>
</body>
</html>
