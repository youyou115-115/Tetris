<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>HYPER TETRIS: OVERDRIVE</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Permanent+Marker&display=swap');

    :root {
        --neon-cyan: #00ffff;
        --neon-magenta: #ff00ff;
        --neon-yellow: #ffff00;
        --neon-red: #ff003c;
    }

    body { 
    margin: 0; 
    background: #000; 
    color: #fff; 
    display: flex; 
    justify-content: center; 
    /* align-items: center; を削除（これで上下中央固定を解除） */
    min-height: 100vh; /* height ではなく min-height に変更 */
    width: 100vw; 
    overflow: hidden; 
    font-family: 'Orbitron', sans-serif;

}

    #game-container { 
    position: relative; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    width: 100%; 
    /* height: 100%; を削除し、中身に合わせて広がるようにする */

}

    #ui-container { 
    display: flex;

}

.game-area {

}

    /* CSSの修正 */

/* Canvasのサイズをスマホ向けに最適化 */
canvas {

/* コンテナが画面からはみ出さないように調整 */

}

#title-screen button {

    /* ゲームオーバー画面 */

    position: absolute;

}

        border: 3px solid var(--neon-magenta);

   /* 修正後 */
#combo-popup {

}
    .shake { animation: shake 0.2s infinite; }

        0% { transform: translate(2px, 2px); }

/* 追加：オーバーロード演出用 */
#overdrive-overlay {

#overdrive-text {
    font-family: 'Permanent Marker', cursive;
    font-size: 80px;

@keyframes pulse {
    from { transform: scale(1.2) rotate(-5deg); }

<body>
    <div id="game-container">

    <!-- ゲーム画面エリア -->
<div class="canvas-wrapper">
    <canvas id="tetris"></canvas>
        
         <!-- タイトル画面：Canvasの真ん中に重なる -->

            <h1 style="font-size: 32px; margin-bottom: 10px;">HYPER<br>TETRIS<br><span style="color: var(--neon-magenta); font-size: 20px;">OVERDRIVE</span></h1>

<script type="module">
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const ROW = 20;
const COL = 10;
let SQ = 30;
    canvas.width = COL * SQ;
    canvas.height = ROW * SQ;

    const colors = [null, '#FF0055', '#00FFCC', '#FFCC00', '#FF00FF', '#00FF00', '#0066FF', '#FF8800'];
    const pieceTypes = {
        'I': [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
        'L': [[0, 2, 0], [0, 2, 0], [0, 2, 2]],
        'J': [[0, 3, 0], [0, 3, 0], [3, 3, 0]],
        'O': [[4, 4], [4, 4]],
        'Z': [[5, 5, 0], [0, 5, 5], [0, 0, 0]],
        'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
        'T': [[0, 7, 0], [7, 7, 7], [0, 0, 0]]
    };

    let arena = [];
    // script内のplayer定義を修正
let player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1, combo: 0, isBoostMode: false };
    let dropCounter = 0;
    let lastTime = 0;
    let dropInterval = 1000;
    let isGameOver = false;
    let gridOffset = 0;
    let overdriveTimer = null;
   class AudioEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.filterNode = null;
        this.initialized = false;
        this.timerId = null;
        this.step = 0;
        this.nextNoteTime = 0;
    }

async init() {
    if (this.ctx) {
        if (this.ctx.state === 'suspended') {
            await this.ctx.resume();
        }
        // 重要：isGameOverがfalseの状態で、BGMが止まっていたら再開させる
        if (!this.initialized || this.ctx.state === 'suspended') {
            this.initialized = true;
            this.startBGM();
        }
        return;
    }

    // 新しく AudioContext を作る（初回のみ）
    try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.filterNode = this.ctx.createBiquadFilter();
        this.filterNode.type = 'lowpass';
        this.filterNode.frequency.value = 1500;

        this.filterNode.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        this.masterGain.gain.value = 0.3;
        
        this.initialized = true;
        this.startBGM();
        console.log("AudioContext initialized");
    } catch (e) {
        console.error("AudioContext error:", e);
    }
}
   async stopBGM() {
        if (this.timerId) {
            clearTimeout(this.timerId);
            this.timerId = null;
        }
        if (this.ctx) {
            await this.ctx.close(); // コンテキストを完全に閉じる
            this.ctx = null;
        }
        this.initialized = false;
        this.step = 0;
    }

    playSynth(freq, type, duration, vol, glide = 0) {
        if (!this.initialized || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (glide > 0) {
            osc.frequency.exponentialRampToValueAtTime(freq / 2, this.ctx.currentTime + duration);
        }
        
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(this.filterNode);
        
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

        startBGM() {
        this.step = 0;
        this.nextNoteTime = this.ctx.currentTime;
        // すでにタイマーが動いている場合は重複しないよう、一度クリアしてから開始
        if (this.timerId) clearTimeout(this.timerId);
        this.scheduleNote();
    }

        scheduleNote() {
        if (!this.initialized) return;

        const tempo = 120;
        const secondsPerBeat = 60 / tempo;

        const chords = [
            [220, 261.6, 329.6, 392.0],
            [174.6, 220.0, 261.6, 329.6],
            [130.8, 164.8, 196.0, 261.6],
            [146.8, 196.0, 246.9, 311.1]
        ];

        const currentChord = chords[Math.floor(this.step / 4) % chords.length];

        // isGameOver でない時だけ音を鳴らす
        if (!isGameOver) {
            if (this.step % 4 === 0) {
                this.playSynth(currentChord[0] / 2, 'triangle', 1.0, 0.2);
            }
            if (this.step % 4 === 0) {
                currentChord.forEach(f => this.playSynth(f, 'square', 0.5, 0.05));
            }
            const melodyPattern = [0, 2, 3, 2, 0, 4, 3, 2]; 
            const noteIdx = this.step % 8;
            if (this.step % 2 === 0) {
                const melodyNote = currentChord[melodyPattern[noteIdx] % 4] * 2;
                this.playSynth(melodyNote, 'square', 0.3, 0.1);
            }
        }

        this.step++;
        this.nextNoteTime += secondsPerBeat;
        this.timerId = setTimeout(() => this.scheduleNote(), secondsPerBeat * 1000);
    }

    playImpact(vol = 0.5) { this.playSynth(60, 'sine', 0.4, vol); }
    playClear(count) {
        const baseFreqs = [220, 261, 329, 392, 523];
        for(let i=0; i<count; i++) {
            this.playSynth(baseFreqs[i % 5], 'sine', 0.5, 0.2);
        }
    }
    playMove() { this.playSynth(400, 'sine', 0.05, 0.05); }
    playRotate() { this.playSynth(600, 'sine', 0.1, 0.05); }
    playDrop() { this.playSynth(200, 'sine', 0.1, 0.1); }
    playHardDrop() { this.playSynth(100, 'square', 0.1, 0.3); }
    playLand() { this.playSynth(50, 'square', 0.1, 0.3); }
    playGameOver() {
        this.playSynth(110, 'sawtooth', 0.5, 0.5);
        this.playSynth(55, 'square', 1.0, 0.5);
    }
}

   window.audio = new AudioEngine(); 

    class LightningParticle {
        constructor(x, y, color, intensity) {
            this.x = x; this.y = y; this.color = color; this.intensity = intensity;
            this.points = [{x: x, y: y}];
            this.life = 1.0;
            this.decay = 0.03 + Math.random() * 0.05;
            this.generateLightning();
        }
        generateLightning() {
            let curX = this.x; let curY = this.y;
            const segments = 5 + (this.intensity * 5);
            for (let i = 0; i < segments; i++) {
                curX += (Math.random() - 0.5) * (40 * this.intensity);
                curY += (Math.random() - 0.5) * (40 * this.intensity);
                this.points.push({x: curX, y: curY});
            }
        }
        update() { this.life -= this.decay; }
        draw(context) {
            context.beginPath();
            context.strokeStyle = this.color;
            context.lineWidth = (3 * this.intensity) * this.life;
            context.shadowBlur = 20 * this.intensity * this.life;
            context.shadowColor = this.color;
            context.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) context.lineTo(this.points[i].x, this.points[i].y);
            context.stroke();
            context.shadowBlur = 0;
        }
    }

    let particles = [];

    function createLightning(x, y, intensity) {
        let color = intensity >= 3 ? '#ff0' : (intensity === 2 ? '#f0f' : '#fff');
        for(let i=0; i<intensity * 2; i++) particles.push(new LightningParticle(x, y, color, intensity));
    }

    function createPiece(type) { return JSON.parse(JSON.stringify(pieceTypes[type])); }

    function drawSquare(x, y, color, context = ctx, size = SQ) {
    // 1. ブロックの本体（少し透明感のある色）
    context.fillStyle = color;
    context.globalAlpha = 0.8;
    context.fillRect(x * size, y * size, size, size);
    context.globalAlpha = 1.0;

    // 2. ネオンの縁取り（光るライン）
    context.strokeStyle = '#fff'; // 中心は白くして輝きを出す
    context.lineWidth = 2;
    context.strokeRect(x * size + 2, y * size + 2, size - 4, size - 4);

    // 3. 外側のネオン・グロー（光の滲み）
    context.shadowBlur = 10;
    context.shadowColor = color;
    context.strokeStyle = color;
    context.lineWidth = 1;
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.shadowBlur = 0;

    // 4. ハイライト（光が当たっている感じ）
    context.fillStyle = 'rgba(255, 255, 255, 0.4)';
    context.fillRect(x * size + 2, y * size + 2, size / 2, 2);
}

   // draw関数内の背景描画部分を修正
function draw() {
    // 背景を少し暗いグラデーションにする
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 背景グリッド（少し歪んだ感じを出すために透明度を調整）
    gridOffset = (gridOffset + (player.level * 0.5)) % SQ;
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = -1; i <= COL; i++) { 
        ctx.beginPath(); ctx.moveTo(i * SQ, 0); ctx.lineTo(i * SQ, canvas.height); ctx.stroke(); 
    }
    for (let i = -1; i <= ROW; i++) {
        let yPos = i * SQ + gridOffset;
        ctx.beginPath(); ctx.moveTo(0, yPos); ctx.lineTo(canvas.width, yPos); ctx.stroke();
    }

    // --- 追加：ノイズ・テクスチャ効果（ランダムなドットを薄く描画） ---
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    for (let i = 0; i < 10; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
    }

    arena.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(x, y, colors[value]); }); });
    if (player.matrix) {
        player.matrix.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawSquare(player.pos.x + x, player.pos.y + y, colors[value]); }); });
    }
    particles.forEach((p, index) => {
        p.update(); p.draw(ctx);
        if (p.life <= 0) particles.splice(index, 1);
    });
}

function resizeCanvas() {
    const container = document.querySelector('#game-container');
    // コンテナの現在の幅を取得（CSSのwidth: 100%が適用された後の幅）
    const availableWidth = container.clientWidth * 0.9; // 左右に少し余白(5%ずつ)を作る
    
    // テトリスのアスペクト比 (1:2) に基づいて高さを計算
    const newWidth = availableWidth;
    const newHeight = availableWidth * 2;

    // Canvasの内部解像度（描画の細かさ）を更新
    canvas.width = newWidth;
    canvas.height = newHeight;

    // 1マスのサイズ(SQ)を、新しいCanvasの幅に基づいて再計算
    // これにより、どんな画面サイズでも「10列」がピッタリ収まる
    SQ = newWidth / COL;

    // 次のプレビュー用Canvasもリサイズ
    nextCanvas.width = 60 * (newWidth / 300); 
    nextCanvas.height = 60 * (newWidth / 300);
}

    function drawNext() {
        nextCtx.fillStyle = '#111';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (player.next) {
            const m = player.next;
            const size = 15; const offset = 15;
            m.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) { nextCtx.fillStyle = colors[value]; nextCtx.fillRect(x * size + offset, y * size + offset, size - 2, size - 2); } }); });
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0) {
                    const ty = y + o.y; const tx = x + o.x;
                    if (ty >= ROW || ty < 0 || tx >= COL || tx < 0 || (arena[ty] && arena[ty][tx] !== 0)) return true;
                }
            }
        }
        return false;
    }

        function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const ty = y + player.pos.y;
                    const tx = x + player.pos.x;
                    // 【修正】行(ty)と列(tx)の両方が、盤面の範囲内であることを厳格にチェック
                    if (ty >= 0 && ty < ROW && tx >= 0 && tx < COL) {
                        arena[ty][tx] = value;
                    }
                }
            });
        });
    }
            function arenaSweep() {
        let rowCount = 0;
        for (let y = ROW - 1; y >= 0; --y) {
            if (arena[y].every(val => val !== 0)) {
                for (let x = 0; x < COL; x++) createLightning(x * SQ + SQ/2, y * SQ + SQ/2, rowCount + 1);
                arena.splice(y, 1);
                arena.unshift(new Array(COL).fill(0));
                rowCount++;
                y++;
            }
        }

        // 【重要】rowCountが1以上の時だけ、確実にポップアップ処理を行う
         if (rowCount > 0) {
            player.combo += rowCount; // コンボ加算
            player.score += rowCount * 100 * player.combo; // 【修正】レベルによる加速を廃止
            const newLevel = Math.floor(player.score / 1000) + 1;
            if (newLevel > player.level) player.level = newLevel;

            const popup = document.getElementById('combo-popup');
            if (popup) {
                popup.style.display = 'block';
                
                // テキスト設定
                if (rowCount === 1) { 
                    popup.innerText = "CLEARED!"; 
                    popup.style.color = "#0ff"; 
                    popup.style.fontSize = "40px";
                } else if (rowCount === 2) { 
                    popup.innerText = "DOUBLE!!"; 
                    popup.style.color = "#f0f"; 
                    popup.style.fontSize = "50px";
                } else if (rowCount === 3) { 
                    popup.innerText = "TRIPLE!!!"; 
                    popup.style.color = "#ff0"; 
                    popup.style.fontSize = "60px";
                } else { 
                    popup.innerText = "ULTRA " + rowCount + "!!!"; 
                    popup.style.color = "#f00"; 
                    popup.style.fontSize = "70px";
                }

                // アニメーション
                const animation = popup.animate([
                    { transform: 'translateX(-50%) scale(0.5) translateY(0)', opacity: 0 },
                    { transform: 'translateX(-50%) scale(1.2) translateY(-20px)', opacity: 1 },
                    { transform: 'translateX(-50%) scale(1) translateY(-40px)', opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'ease-out'
                });

                animation.onfinish = () => {
                    popup.style.display = 'none';
                };
            }

            updateUI();
            audio.playClear(rowCount);
        } else {
            player.combo = 0;
        }
        return rowCount;
    }

    function updateUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
    }

// script内のplayerDrop関数を修正
    function playerDrop() {
    player.pos.y++;
    
    // 1. 【修正】「次に落ちてくるミノ」が、一番上の行（0行目）に衝突するかチェック
    // player.pos.y が 0 のとき、ミノのパーツが 0行目にあるかを確認
    let willCollideAtTop = false;
    for (let y = 0; y < player.matrix.length; y++) {
        for (let x = 0; x < player.matrix[y].length; x++) {
            if (player.matrix[y][x] !== 0) {
                // ミノのパーツの座標が、盤面の最上段(y=0)に重なる場合
                if (player.pos.y + y <= 0) {
                    willCollideAtTop = true;
                    break;
                }
            }
        }
        if (willCollideAtTop) break;
    }

    if (willCollideAtTop) {
        gameOver();
        return;
    }

    // 2. 衝突判定（着地判定）
    if (collide(arena, player)) {
        player.pos.y--; 
        merge(arena, player); 
        arenaSweep(); 

        audio.playLand(); 
        
        // 着地した結果、一番上の行にブロックが残った場合もゲームオーバー
        if (arena[0].some(val => val !== 0)) {
            gameOver();
        } else {
            playerReset();
        }
    }
    
    dropCounter = 0;
}
    function playerMove(dir) {
    player.isBoostMode = false; // 【追加】操作したらブースト解除
    player.pos.x += dir;
    if (collide(arena, player)) {
        player.pos.x -= dir;
    } else {
        audio.playMove();
    }
}

    function playerRotate() {
    player.isBoostMode = false; // 【追加】操作したらブースト解除
    const oldMatrix = player.matrix;
    player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i]).reverse());
    if (collide(arena, player)) {
        player.matrix = oldMatrix;
    } else {
        audio.playRotate();
    }
}
       function playerReset() {
        const pieces = 'ILJOTSZ';
        if (!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = Math.floor(COL / 2) - Math.floor(player.matrix[0].length / 2);
        drawNext();
        
        // ここには何も書かない（判定は playerDrop で行う）
    }

    function gameOver() {
    isGameOver = true;
    if (window.audio) {
        window.audio.playGameOver();
    }
    
    // 【追加】現在のスコアを結果画面のスコア欄に反映させる
    document.getElementById('final-score').innerText = player.score;
    
    updateHighScore();
    document.getElementById('gameover-screen').style.display = 'flex';
}

    function updateHighScore() {
        const highScore = localStorage.getItem('tetris_high_score') || 0;
        if (player.score > highScore) localStorage.setItem('tetris_high_score', player.score);
        document.getElementById('high-score').innerText = localStorage.getItem('tetris_high_score');
    }

function update(time = 0) {
    if (isGameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;

    // 1. 速度計算（限界なし：レベルが上がるごとに20msずつ加速）
    const currentInterval = player.isBoostMode 
        ? 100 
        : (1000 - (player.level * 20));     
    
    const overdriveOverlay = document.getElementById('overdrive-overlay');
    
    // --- 【修正】オーバーロード演出の判定 ---
    // 速度が 20ms 以下になったら、崩壊のカウントダウンを開始する
    // (0にすると、ゲームが物理的に止まる前にゲームオーバー判定に負けるため)
    if (currentInterval <= 20) { 
        if (overdriveOverlay) overdriveOverlay.style.display = 'flex';
        
        // 1秒間だけ「OVERDRIVE!!」を見せてからタイトルへ
        if (overdriveTimer) clearTimeout(overdriveTimer);
        overdriveTimer = setTimeout(() => {
            resetToTitle();
        }, 3000); 
        
        // 演出中はゲームの動きを止める
        return; 
    } else {
        if (overdriveOverlay) overdriveOverlay.style.display = 'none';
    }

    // 2. プレイヤーの座標チェック
    if (player.pos.y < 0) {
        gameOver();
        return;
    }

    // 3. 落下処理
    if (dropCounter >= currentInterval) {
        playerDrop();
        dropCounter -= currentInterval; 
    }
    draw();
    requestAnimationFrame(update);
}
// --- 追加：リセット関数の修正 ---
// --- resetToTitle の修正 ---
function resetToTitle() {
    // タイマーを止める
    if (overdriveTimer) {
        clearTimeout(overdriveTimer);
        overdriveTimer = null;
    }

    // 1. まず、画面表示をリセットする（isGameOverはまだtrueのまま）
    document.getElementById('title-screen').style.display = 'flex';
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('overdrive-overlay').style.display = 'none';
    
    // 2. データの初期化
    arena = Array.from({ length: ROW }, () => Array(COL).fill(0));
    player.score = 0; 
    player.level = 1; 
    player.combo = 0; 
    player.next = null;
    particles = [];
    updateUI();

    // 3. ここでは isGameOver = false にしない！
    // ゲームを再開するのは startGame が呼ばれた時だけにする
}


window.startGame = async function() {
    console.log("Starting game...");
    
    await window.audio.init();
    isGameOver = false; 

    // BGMをリセットして再開
    window.audio.startBGM();

    arena = Array.from({ length: ROW }, () => Array(COL).fill(0));
    player.score = 0; 
    player.level = 1; 
    player.combo = 0; 
    player.next = null;
    particles = [];
    resizeCanvas();

    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('overdrive-overlay').style.display = 'none';

    updateUI();
    playerReset();
    update();
};
    document.addEventListener('keydown', event => {
        if (isGameOver) return;
        const key = event.key.toLowerCase();
        if (key === 'a') playerMove(-1);
        if (key === 'd') playerMove(1);
        if (key === 'w') playerRotate();
        if (key === 's') {
            playerDrop();
        } else if (key === ' ') {
            while (!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            arenaSweep();
            if (arena[0].some(val => val !== 0)) { gameOver(); } 
            else { playerReset(); }
            audio.playHardDrop();
            event.preventDefault();
        }
    });

    // scriptタグ内の該当箇所を修正

// --- スマホ操作の修正 ---
document.addEventListener('contextmenu', event => event.preventDefault());

let touchStartX = 0, touchStartY = 0, touchStartTime = 0, longPressTimer;

// --- JavaScriptの修正 ---

// 【重要】setIntervalを止めるために、グローバル（関数の外）で定義
let boostTimer = null; 
let boostLoop = null; 

window.addEventListener('touchstart', (e) => {
    if (e.cancelable) e.preventDefault();
    if (isGameOver) return;

    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = Date.now();

    // すでにタイマーが動いていたら一旦クリア
    clearTimeout(boostTimer);
    if (boostLoop) clearInterval(boostLoop);

    // 長押し判定
    boostTimer = setTimeout(() => {
        if (Date.now() - touchStartTime < 1000) {
            player.isBoostMode = true;
            
            // 【修正】boostLoopをグローバル変数として扱う
            boostLoop = setInterval(() => {
                if (!player.isBoostMode) {
                    clearInterval(boostLoop);
                    return;
                }
                playerDrop();
                audio.playDrop();
            }, 100); 

            // 1秒経ったら自動で解除
            setTimeout(() => { 
                player.isBoostMode = false; 
                if (boostLoop) clearInterval(boostLoop);
            }, 1000);
        }
    }, 500);
}, {passive: false});

window.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    if (isGameOver) return;

    // 【重要】指を離した瞬間に、すべてのタイマーを止める
    clearTimeout(boostTimer);
    if (boostLoop) {
        clearInterval(boostLoop);
        boostLoop = null;
    }
    player.isBoostMode = false; 

    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const threshold = 30;

    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
        if (Math.abs(dx) > Math.abs(dy)) {
            playerRotate(); 
        } else {
            if (dy > threshold) {
                // 下フリック：ハードドロップ
                while (!collide(arena, player)) player.pos.y++;
                player.pos.y--;
                merge(arena, player);
                arenaSweep();
                if (player.pos.y < 0 || arena[0].some(val => val !== 0)) { 
                    gameOver(); 
                } else { 
                    playerReset(); 
                }
                audio.playHardDrop();
            } else if (dy < -threshold) {
                playerRotate(); 
            }
        }
    } else {
        // タップ操作：左右移動
        if (touch.clientX < window.innerWidth / 2) {
            playerMove(-1);
        } else {
            playerMove(1);
        }
    }
}, {passive: false});

    playerReset();
    draw();
// scriptタグの最後の方、またはDOMContentLoadedの中に以下を追加
document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.querySelector('#title-screen button');
    if (startBtn) {
        // 「click」だけでなく「touchstart」でも確実に反応するようにする
        const triggerStart = (e) => {
            e.preventDefault(); // ブラウザのデフォルト動作を防止
            startGame();
        };
        
        startBtn.addEventListener('click', triggerStart);
        startBtn.addEventListener('touchstart', triggerStart, {passive: false});
    }
});

// 画面が回転したり、サイズが変わったりした時に対応
window.addEventListener('resize', resizeCanvas);
// 初期読み込み時にも実行
window.addEventListener('load', resizeCanvas);
    
</script>
